name: Swift CI
on:
  pull_request:
  push:
    branches: ['main']

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  format:
    name: Format (lint)
    runs-on: hiero-client-sdk-linux-large
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system deps for Swift
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl unzip xz-utils ca-certificates pkg-config \
            clang libicu-dev libxml2-dev libsqlite3-dev zlib1g-dev \
            libcurl4-openssl-dev libssl-dev

      - name: Setup Swift (toolchain)
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: '6.0'

      - name: Build swift-format
        run: |
          set -euxo pipefail
          git clone --depth=1 --branch 600.0.0 https://github.com/apple/swift-format.git .swift-format-src
          pushd .swift-format-src
          swift build -c release
          echo "$PWD/.build/release" >> $GITHUB_PATH
          popd
          swift-format --version || true

      - name: Format (lint)
        run: |
          swift-format lint --strict --configuration .swift-format.json --recursive --parallel Sources/ Tests/ Examples/ Package.swift

  test:
    name: Build and Test SDK
    strategy:
      matrix:
        swift: ["5.9", "5.10", "6.0", "6.1", "6.2"]
    runs-on: hiero-client-sdk-linux-large

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450
        with:
          egress-policy: audit

      - name: Setup Swift
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: ${{ matrix.swift }}

      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Cache SPM build dir
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .build
          key: ${{ runner.os }}-${{ matrix.swift }}-spm-${{ github.job }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.swift }}-spm-

      - name: Install system dependencies for Swift/gRPC
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git curl jq coreutils ca-certificates \
            clang libicu-dev libxml2-dev libsqlite3-dev zlib1g-dev \
            libcurl4-openssl-dev libssl-dev pkg-config \
            protobuf-compiler

      - name: Verify Swift installation
        run: |
          swift --version
          which swift
          swift package --version

      - name: Build SDK and TCK
        run: |
          swift build

      - name: Run unit tests (HieroUnitTests)
        env:
          HIERO_PROFILE: ciUnit
        run: swift test --filter HieroUnitTests

      - name: Prepare Hiero Solo
        id: solo
        uses: hiero-ledger/hiero-solo-action@328bc84c3b00a990a151418144fd682a4eb76ea6 # v0.19.0
        with:
          soloVersion: v0.65.1
          installMirrorNode: true
          mirrorNodeVersion: v0.153.0
          hieroVersion: v0.73.0
          dualMode: true

      - name: Wait for mirror node fee estimation
        run: |
          set -euo pipefail
          # The mirror node's Java REST loads the simple fee schedule (file 0.0.113) once at startup and
          # then only every 10 minutes. On a fresh Solo network the importer has not ingested that file
          # yet when rest-java starts, so POST /api/v1/network/fees answers "400 Unknown transaction type"
          # for the first ~10 minutes and FeeEstimateQueryIntegrationTests fail. Shorten the refresh
          # interval (which restarts the pod), re-open the port-forward and wait for the first estimate.
          kubectl -n solo set env deployment/mirror-1-restjava HIERO_MIRROR_REST_JAVA_FEE_REFRESH_INTERVAL=PT5S
          kubectl -n solo rollout status deployment/mirror-1-restjava --timeout=5m
          pkill -f 'port-forward svc/mirror-1-restjava' || true
          sleep 2
          kubectl -n solo port-forward svc/mirror-1-restjava 8084:80 > /tmp/restjava-port-forward.log 2>&1 &
          sleep 3
          # A minimal CryptoTransfer (Transaction > SignedTransaction > TransactionBody), no signatures.
          echo 'Ki0KKwoICgIIARICGAISAhgDGIDC1y8iAgh4chIKEAoGCgIYAhABCgYKAhgDEAI=' | base64 -d > /tmp/fee-probe.bin
          for _ in $(seq 1 120); do
            code=$(curl -s -o /tmp/fee-probe.out -w '%{http_code}' -X POST \
              -H 'Content-Type: application/protobuf' --data-binary @/tmp/fee-probe.bin \
              'http://127.0.0.1:8084/api/v1/network/fees?mode=INTRINSIC' || true)
            if [ "$code" = "200" ]; then
              echo "fee estimation ready: $(cat /tmp/fee-probe.out)"
              exit 0
            fi
            sleep 5
          done
          echo "fee estimation still unavailable: HTTP ${code} $(cat /tmp/fee-probe.out 2>/dev/null)"
          kubectl -n solo logs deployment/mirror-1-restjava --tail=50 || true
          exit 1

      - name: Run integration tests (HieroIntegrationTests)
        env:
          HIERO_PROFILE: ciIntegration
          HIERO_OPERATOR_ID: ${{ steps.solo.outputs.accountId }}
          HIERO_OPERATOR_KEY: ${{ steps.solo.outputs.privateKey }}
          HIERO_ENVIRONMENT_TYPE: custom
          HIERO_CONSENSUS_NODES: 127.0.0.1:50211,127.0.0.1:51211
          HIERO_CONSENSUS_NODE_ACCOUNT_IDS: 0.0.3,0.0.4
          HIERO_MIRROR_NODES: 127.0.0.1:5600
        run: swift test --filter HieroIntegrationTests
